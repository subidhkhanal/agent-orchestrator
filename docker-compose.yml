# Full local stack: Postgres + the app container (API on :8000 with one worker).
#   docker compose up --build
# For development without Docker on Windows, see scripts/local_pg.ps1 instead.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: agent_orchestrator
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://orchestrator:orchestrator@postgres:5432/agent_orchestrator
      FAKE_LLM: ${FAKE_LLM:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

volumes:
  pgdata:
