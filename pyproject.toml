[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Supervisor-worker multi-agent orchestration platform built on LangGraph and Postgres."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langchain-core>=1.0,<2",
    # The binary wheel is blocked by Application Control on some Windows dev machines;
    # there we fall back to psycopg's pure-Python implementation plus the system libpq.
    "psycopg[pool]>=3.2,<4",
    "psycopg[binary]>=3.2,<4; sys_platform != 'win32'",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "anthropic>=1.12",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: needs a real Postgres (set TEST_DATABASE_URL); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Row values from psycopg are typed Any; returning them is the point of the data layer.
module = ["orchestrator.db.*", "orchestrator.api.*"]
warn_return_any = false
