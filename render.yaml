# Render Blueprint: the backend (API + in-process worker) on Render's free plan.
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/subidhkhanal/agent-orchestrator
# Secrets marked `sync: false` are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: agent-orchestrator-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /livez
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # Neon *direct* (unpooled) connection string
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MODELS_CONFIG          # Claude: Opus 5.5 workers, Haiku 5.5 routing
        value: config/models.toml
      # One process: the worker runs inside the API (free instance has 512 MB).
      - key: EMBEDDED_WORKER
        value: "true"
      - key: WORKER_ID
        value: render
      # Let the scale-to-zero database sleep: wake the worker in-process, poll rarely,
      # and close idle connections.
      - key: WORKER_POLL_S
        value: "900"
      - key: WORKER_SWEEP_S
        value: "900"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_POOL_MAX_IDLE_S
        value: "60"
      # Free web services sleep after 15 min without traffic; ping /livez every 10 min.
      # KEEPALIVE_URL defaults to RENDER_EXTERNAL_URL (set by Render) in scripts/start.sh.
      - key: KEEPALIVE_INTERVAL_S
        value: "600"
      # Render's proxy sets X-Forwarded-For; trust it so rate limits see the visitor's real IP
      # (without this every request appears to come from a proxy address). Safe because the
      # service is only reachable through Render's proxy.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Public demo limits.
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: https://agent-orchestrator-opal.vercel.app
      # Real money on Claude: a hard cap per run, plus the per-IP rate limit below. No daily
      # total (owner's choice). A measured run with one rejection cost $0.20-0.35.
      - key: DEMO_MAX_USD_PER_RUN
        value: "1.50"
      - key: DEMO_MAX_TOKENS_PER_RUN    # includes cache reads (tool loops resend history)
        value: "600000"
      - key: RATE_LIMIT_RUNS_PER_HOUR
        value: "10"
      - key: MAX_TASK_CHARS
        value: "500"
