name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
          POSTGRES_DB: agent_orchestrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchestrator"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Everything in CI uses the deterministic fake LLM: no API keys, no cost.
      FAKE_LLM: "true"
      DATABASE_URL: postgresql://orchestrator:orchestrator@localhost:5432/agent_orchestrator_test
      TEST_DATABASE_URL: postgresql://orchestrator:orchestrator@localhost:5432/agent_orchestrator_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts evals
          ruff format --check src tests scripts evals
      - name: Type check
        run: mypy src
      - name: Migrate
        run: alembic upgrade head
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (Postgres, fake LLM)
        run: pytest tests/integration -q
      - name: Chaos smoke (10 runs, worker kills)
        run: python scripts/chaos.py --runs 10 --workers 2 --kill-every 2 --timeout 240
      - name: Offline eval harness smoke
        run: python evals/run_eval.py --fake --limit 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
